# =============================================================================
# Qdrant — vector store for semantic retrieval, as its own stack.
# =============================================================================
# Split out of best/vanna/docker-compose.yml so the index outlives any one
# consumer: `docker compose down -v` in the Vanna stack no longer takes the
# collection with it, and a second consumer can share one index instead of
# running a second copy.
#
# Standalone: it runs on its own default network, with no external dependencies.
#
#   docker compose up -d
#
#   Dashboard  http://127.0.0.1:6333/dashboard
#   Collections http://127.0.0.1:6333/collections
#
# Other containers reach it as `http://qdrant:6333` by joining this stack's
# network (vectordb_default) or by publishing through the loopback port above.
# =============================================================================

name: vectordb

services:

  # ---------------------------------------------------------------------------
  # Qdrant — one collection per workspace, written by every API worker
  # ---------------------------------------------------------------------------
  # A server rather than Qdrant's embedded mode because several API workers write
  # to the index; embedded mode is one directory with one lock, and the second
  # worker to open it fails.
  qdrant:
    # Pinned by digest as well as tag. Changing this can make existing storage
    # unreadable -- 1.19 refuses segments written by 1.12 and crash-loops. That is
    # recoverable and cheap because the collection is *derived*:
    #   docker compose stop qdrant && docker volume rm vectordb_qdrant_data
    #   docker compose up -d qdrant && vanna knowledge reindex
    # The markdown under knowledge/ is the source of truth.
    image: qdrant/qdrant:v1.19.0@sha256:057ee3a8da769fe7310dd3537b4dc7583bf87a95ce8ac43c0af5a46bc580d1fc
    container_name: vector_qdrant
    volumes:
      - qdrant_data:/qdrant/storage
    # Bound to loopback, not 0.0.0.0. Qdrant ships with no authentication: a
    # default `ports: "6333:6333"` publishes an unauthenticated read/write vector
    # store to every host on the LAN. Loopback keeps the dashboard and host-side
    # `vanna knowledge reindex` working; container-to-container traffic does not
    # use this mapping at all and is unaffected by narrowing it.
    ports:
      - "127.0.0.1:${QDRANT_PORT:-6333}:6333"
    expose:
      - "6333"
    restart: unless-stopped
    healthcheck:
      # Qdrant's image has no curl or wget, so probe the port from bash.
      # This proves the listener is up, not that a collection is servable — a
      # storage-format refusal (see the image comment) shows up in the log and as
      # a crash loop, not here.
      test: ["CMD-SHELL", "bash -c ':> /dev/tcp/127.0.0.1/6333'"]
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3
    security_opt:
      - no-new-privileges:true

# =============================================================================
# Persistent named volume
# =============================================================================
volumes:
  qdrant_data:
    # Named explicitly so the
    # recovery command above stays correct no matter what the directory — and
    # therefore the default project name — is called.
    name: vectordb_qdrant_data
