# Continuous delivery for the Qdrant stack.
#
#   ci        the whole of ci.yml; nothing ships that fails it
#   deploy    over SSH: copy docker-compose.yml and docker-compose.prod.yml to the
#             host and run `docker compose -f ... -f ... up -d --wait`
#
# Secrets (Settings -> Secrets and variables -> Actions):
#
#   DEPLOY_HOST, DEPLOY_USER              where to SSH, port 22
#   DEPLOY_SSH_KEY                        private key; its public half in authorized_keys
#   DEPLOY_HOST_FINGERPRINT               the host key's SHA256 fingerprint, from
#                                           ssh-keygen -lf /etc/ssh/ssh_host_ed25519_key.pub
#   DEPLOY_PATH                           absolute directory the stack lives in
#
# The host must already have Docker Compose v2 and the external multidb_network
# (started by the databases stack). The qdrant_data volume is never removed.

name: Deploy

on:
  push:
    branches: [main]
    paths:
      - '**'
      - '!**.md'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # Never cancel a deploy halfway through; queue the next one behind it.
  group: deploy-prod
  cancel-in-progress: false

jobs:
  ci:
    uses: ./.github/workflows/ci.yml

  deploy:
    needs: ci
    runs-on: ubuntu-24.04
    environment: production
    env:
      DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
      DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
      DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
    steps:
      - uses: actions/checkout@v4

      - name: Check deploy secrets
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_HOST_FINGERPRINT: ${{ secrets.DEPLOY_HOST_FINGERPRINT }}
        run: |
          missing=()
          for v in DEPLOY_HOST DEPLOY_USER DEPLOY_SSH_KEY DEPLOY_HOST_FINGERPRINT DEPLOY_PATH; do
            [ -n "${!v}" ] || missing+=("$v")
          done
          if [ "${#missing[@]}" -gt 0 ]; then
            echo "::error::Missing repository secrets: ${missing[*]}"
            exit 1
          fi

      - name: Trust the host key, and only that one
        # ssh-keyscan alone would trust whoever answers; the fingerprint secret is
        # what turns it into verification.
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_HOST_FINGERPRINT: ${{ secrets.DEPLOY_HOST_FINGERPRINT }}
        run: |
          install -d -m 700 ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" | tr -d '\r' > ~/.ssh/id_ed25519_github
          chmod 600 ~/.ssh/id_ed25519_github

          want=${DEPLOY_HOST_FINGERPRINT#SHA256:}
          : > ~/.ssh/known_hosts
          ssh-keyscan -T 15 "$DEPLOY_HOST" > scanned 2>/dev/null || true
          while read -r line; do
            case $line in ''|'#'*) continue ;; esac
            fp=$(ssh-keygen -lf - <<<"$line" | awk '{print $2}')
            if [ "${fp#SHA256:}" = "$want" ]; then
              echo "$line" >> ~/.ssh/known_hosts
            fi
          done < scanned
          if [ ! -s ~/.ssh/known_hosts ]; then
            echo "::error::No host key from DEPLOY_HOST matches DEPLOY_HOST_FINGERPRINT"
            exit 1
          fi

          cat > ~/.ssh/config <<EOF
          Host deploy
            HostName $DEPLOY_HOST
            User $DEPLOY_USER
            IdentityFile ~/.ssh/id_ed25519_github
            IdentitiesOnly yes
            StrictHostKeyChecking yes
            ServerAliveInterval 30
          EOF

      - name: Copy compose file
        run: |
          ssh deploy "mkdir -p $(printf %q "$DEPLOY_PATH")"
          scp docker-compose.yml docker-compose.prod.yml "deploy:$DEPLOY_PATH/"

      - name: Deploy
        run: |
          ssh deploy "cd $(printf %q "$DEPLOY_PATH") &&             docker compose -f docker-compose.yml -f docker-compose.prod.yml pull &&             docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d --wait"
