# Continuous integration: the compose file must parse.
# `docker compose config` does not need the external multidb_network to exist.

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  compose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Compose file is valid
        run: docker compose -f docker-compose.yml config --quiet
